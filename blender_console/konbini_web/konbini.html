<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨夜便利店 · 微缩街角</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d18}
  canvas{display:block}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d18);
scene.fog = new THREE.Fog(0x0a0d18, 9, 22);

const camera = new THREE.PerspectiveCamera(33, innerWidth/innerHeight, 0.05, 60);
camera.position.set(3.3, -3.7, 3.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.target.set(0.0, 0.0, 0.35);
controls.minDistance = 0.8; controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;

/* ── 光：暖店内 × 冷雨夜 ── */
scene.add(new THREE.AmbientLight(0x323c60, 1.7));
const hemi = new THREE.HemisphereLight(0x4a5f92, 0x14161f, 1.7);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa8d8, 0.75);
moon.position.set(3, 2, 6); scene.add(moon);
const warm1 = new THREE.PointLight(0xffd9a0, 1.4, 1.8, 2);
warm1.position.set(-0.5, 0.55, 1.7); scene.add(warm1);
const warm2 = new THREE.PointLight(0xffd9a0, 1.4, 1.8, 2);
warm2.position.set(0.45, 0.55, 1.7); scene.add(warm2);
const neon = new THREE.PointLight(0xff8a30, 2.2, 2.0, 2);
neon.position.set(-0.05, -0.1, 2.1); scene.add(neon);
const lamp = new THREE.PointLight(0xffb866, 2.4, 2.0, 2);
lamp.position.set(1.10, -1.05, 1.45); scene.add(lamp);
const lamp2 = new THREE.PointLight(0xffb866, 3.0, 2.0, 2);
lamp2.position.set(-1.06, -1.05, 1.45); scene.add(lamp2);
const vendGlow1 = new THREE.PointLight(0xff5570, 1.2, 1.2, 2);
vendGlow1.position.set(0.95, -0.1, 0.7); scene.add(vendGlow1);
const vendGlow2 = new THREE.PointLight(0x5588ff, 1.2, 1.2, 2);
vendGlow2.position.set(1.13, -0.1, 0.7); scene.add(vendGlow2);

/* ── toon 三阶渐变 ── */
const gradTex = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 1;
  const g = c.getContext('2d');
  ['#4a4a52','#9a9aa4','#f2f2f6'].forEach((col,i)=>{g.fillStyle=col;g.fillRect(i,0,1,1);});
  const t = new THREE.CanvasTexture(c);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  return t;
})();
const hullMat = new THREE.MeshBasicMaterial({color: 0x0d0f18, side: THREE.BackSide});

const flicker = [];
const doors = [];
let tlRed = null, tlGreen = null;

function geoFor(rec) {
  const [sx, sy, sz] = rec.s;
  if (rec.g === 'cyl') return new THREE.CylinderGeometry(sx/2, sx/2, sz, 20);
  if (rec.g === 'plane') return new THREE.BoxGeometry(sx, sy, 0.006);
  return new THREE.BoxGeometry(sx, sy, sz);
}

function toonMesh(rec) {
  const m = rec.m;
  const glow = m.e && m.es > 0;
  const glass = m.a < 0.95;
  const mat = new THREE.MeshToonMaterial({
    color: new THREE.Color(...m.c),
    gradientMap: gradTex,
    transparent: glass,
    opacity: m.a,
  });
  if (glow) {
    mat.emissive = new THREE.Color(...m.e);
    mat.emissiveIntensity = Math.min(m.es, 1.6) * 0.85;
    if (/MAT_SignGlow|MAT_Lightbox|MAT_VendA|MAT_VendB/i.test(rec.n))
      flicker.push({m: mat, base: mat.emissiveIntensity});
  }
  if (/MAT_Wet/i.test(rec.n)) {
    const std = new THREE.MeshStandardMaterial({
      color: new THREE.Color(...m.c), roughness: 0.06, metalness: 0.75,
      emissive: new THREE.Color(0x0a1428), emissiveIntensity: 0.5});
    return {mesh: new THREE.Mesh(geoFor(rec), std), std: true};
  }
  return {mesh: new THREE.Mesh(geoFor(rec), mat), std: false};
}

/* ── 载入场景 JSON ── */
fetch('scene.json').then(r => r.json()).then(objs => {
  for (const rec of objs) {
    if (rec.s[0] <= 0 || rec.s[1] <= 0 || rec.s[2] <= 0) continue;
    const {mesh, std} = toonMesh(rec);
    mesh.name = rec.n;
    mesh.position.set(...rec.p);
    mesh.rotation.set(...rec.r);
    if (std) mesh.receiveShadow = true;
    scene.add(mesh);
    if (rec.m.a >= 0.95 && !(rec.m.e && rec.m.es > 0) && rec.g !== 'plane') {
      const hull = new THREE.Mesh(mesh.geometry, hullMat);
      hull.scale.multiplyScalar(rec.g === 'cyl' ? 1.05 : 1.028);
      mesh.add(hull);
    }
    if (rec.n.startsWith('OBJ_Door')) doors.push(mesh);
    if (rec.n === 'OBJ_TL_Red') tlRed = mesh;
    if (rec.n === 'OBJ_TL_Green') tlGreen = mesh;
  }
  document.title = 'LOADED:' + objs.length;
}).catch(e => { document.title = 'ERR:' + e.message; });

/* ── 雨 ── */
const RAIN = 2600;
const rainGeo = new THREE.BufferGeometry();
const rp = new Float32Array(RAIN * 3);
for (let i = 0; i < RAIN; i++) {
  rp[i*3]   = (Math.random()-0.5) * 5;
  rp[i*3+1] = Math.random() * 4.5;
  rp[i*3+2] = (Math.random()-0.5) * 5;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
  color: 0x9fb8dd, size: 0.011, transparent: true, opacity: 0.5}));
scene.add(rain);

/* ── 屋檐滴水 ── */
const drips = [];
const dripGeo = new THREE.SphereGeometry(0.006, 6, 6);
const dripMat = new THREE.MeshBasicMaterial({color: 0x9fc4e8, transparent: true, opacity: 0.7});
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(dripGeo, dripMat);
  m.userData = {x: -0.9 + Math.random()*1.9, y: -0.32, z0: 1.78, t: Math.random()};
  scene.add(m); drips.push(m);
}

/* ── 积水波纹 ── */
const ripples = [];
const ringGeo = new THREE.RingGeometry(0.5, 0.56, 24);
const spots = [[-0.55,-0.85],[0.35,-0.60],[0.75,-0.95],[-0.1,-0.7],[0.55,-0.75],[-0.8,-0.65]];
for (let i = 0; i < 14; i++) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color: 0x8fb4e0, transparent: true, opacity: 0, side: THREE.DoubleSide}));
  const s = spots[i % spots.length];
  m.position.set(s[0] + (Math.random()-0.5)*0.4, s[1] + (Math.random()-0.5)*0.25, 0.007);
  m.rotation.x = -Math.PI/2;
  m.userData = {t: Math.random()};
  scene.add(m); ripples.push(m);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.30, 0.65, 0.85);
composer.addPass(bloom);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.elapsedTime;

  const pos = rain.geometry.attributes.position;
  for (let i = 0; i < RAIN; i++) {
    let y = pos.getY(i) - dt * (2.2 + (i % 5) * 0.35);
    if (y < 0) y = 4.2 + Math.random() * 0.4;
    pos.setY(i, y);
  }
  pos.needsUpdate = true;

  for (const d of drips) {
    d.userData.t += dt * 0.55;
    if (d.userData.t > 1) d.userData.t = 0;
    const k = d.userData.t;
    d.position.set(d.userData.x, d.userData.y, d.userData.z0 - k * k * 1.78);
    d.material.opacity = 0.7 * (1 - k * 0.6);
  }
  for (const r of ripples) {
    r.userData.t += dt * 0.5;
    if (r.userData.t > 1) r.userData.t = 0;
    const k = r.userData.t;
    r.scale.setScalar(0.12 + k * 0.55);
    r.material.opacity = 0.42 * (1 - k) * (1 - k);
  }

  for (const f of flicker) {
    const flick = Math.random() < 0.006 ? 0.3 : 1.0;
    f.m.emissiveIntensity = f.base * (0.86 + 0.14 * Math.sin(t * 6.7 + f.m.uuid.length * 7)) * flick;
  }
  neon.intensity = 3.2 + Math.sin(t * 6.3) * 0.6;

  const cyc = t % 6;
  let off = 0;
  if (cyc < 0.9) off = Math.min(1, cyc / 0.9);
  else if (cyc < 2.4) off = 1;
  else if (cyc < 3.3) off = Math.max(0, 1 - (cyc - 2.4) / 0.9);
  for (const d of doors) {
    const base = d.name.endsWith('L') ? -0.15 : 0.22;
    d.position.x = base + (d.name.endsWith('L') ? -1 : 1) * off * 0.34;
  }
  if (tlRed && tlGreen) {
    const green = (t % 12) > 6;
    tlRed.material.emissiveIntensity = green ? 0.08 : 1.7;
    tlGreen.material.emissiveIntensity = green ? 1.7 : 0.08;
  }
  warm1.intensity = 1.4 + Math.sin(t * 1.7) * 0.06;
  warm2.intensity = 1.4 + Math.sin(t * 1.7 + 1) * 0.06;

  controls.update();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
