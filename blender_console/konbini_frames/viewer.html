<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>雨夜便利店 · 环绕视角（拖动画面旋转）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07080f;display:flex;
            align-items:center;justify-content:center;flex-direction:column}
  img{max-width:100vw;max-height:88vh;object-fit:contain;user-select:none;
      -webkit-user-drag:none}
  #bar{width:min(92vw,900px);height:26px;margin-top:14px;border-radius:13px;
       background:#151827;cursor:ew-resize;position:relative}
  #fill{height:100%;border-radius:13px;background:linear-gradient(90deg,#ff8a30,#ff5570);
        width:0%}
  #hint{color:#5a6480;font:12px/1 monospace;margin-top:8px;letter-spacing:2px}
</style>
</head>
<body>
<img id="frame" draggable="false">
<div id="bar"><div id="fill"></div></div>
<div id="hint">◀ 拖动进度条旋转视角 · 松手继续自动环绕 ▶</div>
<script>
const N = 144;
const img = document.getElementById('frame');
const fill = document.getElementById('fill');
const url = i => `konbini_frames/fr_${String(((i % N) + N) % N + 1).padStart(4, '0')}.png`;
let cur = 0, playing = true, scrubbing = false;
function show(i) {
  cur = ((i % N) + N) % N;
  img.src = url(cur);                                  // 流式加载，浏览器缓存已播帧
  fill.style.width = (cur / (N - 1) * 100) + '%';
}
img.src = url(0);
requestAnimationFrame(tick);
function tick() {
  if (playing && !scrubbing) show(cur + 1);
  requestAnimationFrame(tick);
}
// 拖进度条 = 转视角（scrub）
const bar = document.getElementById('bar');
function scrubTo(clientX) {
  const r = bar.getBoundingClientRect();
  const k = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  playing = false;
  show(Math.round(k * (N - 1)));
}
bar.addEventListener('pointerdown', e => { scrubbing = true; scrubTo(e.clientX); });
addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
addEventListener('pointerup', () => { scrubbing = false; });
// 拖画面本身也能转（惯性延续）
let dragX = null, dragFrame = 0;
img.addEventListener('pointerdown', e => { dragX = e.clientX; dragFrame = cur;
  playing = false; });
addEventListener('pointermove', e => {
  if (dragX !== null) {
    const df = Math.round((e.clientX - dragX) * 0.6);
    show(dragFrame + df);
  }
});
addEventListener('pointerup', () => {
  if (dragX !== null) { dragX = null; playing = true; }   // 松手继续自动环绕
});
</script>
</body>
</html>
