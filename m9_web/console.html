<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>虎式坦克 · 交互控制台</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--ink:#e0e0e0;--mut:#888;--line:#333;
      --teal:#0af;--green:#5c5;--red:#f55;--amber:#fa0;--btn:#292950;--btnh:#383868}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 monospace}
.hdr{padding:12px 20px;background:var(--card);display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.hdr h1{font-size:15px;margin:0}.badge{font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.grid{display:grid;grid-template:1fr 1fr / 1fr 1fr;gap:12px;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-y:auto;max-height:420px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--teal)}
.btn{display:inline-block;padding:5px 14px;margin:3px 4px;border-radius:6px;border:none;cursor:pointer;
     font-size:12px;background:var(--btn);color:var(--ink)}
.btn:hover{background:var(--btnh)}.btn:active{transform:scale(.97)}
.btn.g{background:#1a3a1a;color:var(--green)}.btn.r{background:#3a1a1a;color:var(--red)}
.seg{padding:4px 8px;margin:2px 0;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid transparent}
.seg:hover{border-color:var(--teal)}.seg.sel{border-color:var(--teal);background:rgba(0,170,255,.1)}
.seg.pass{border-left:3px solid var(--green)}.seg.fail{border-left:3px solid var(--red)}
.log{font-size:11px;max-height:200px;overflow-y:auto}
.log div{padding:2px 4px;border-bottom:1px solid #222}
input{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:4px 8px;border-radius:4px;font-size:12px}
#renderImg{max-width:100%;border-radius:4px;margin-top:8px}
</style>
</head>
<body>
<div class="hdr">
  <h1>🐯 虎式坦克 · 交互控制台</h1>
  <span class="badge" id="modeBadge">—</span>
  <span class="badge" id="segCount">—</span>
</div>
<div class="grid">
  <div class="card"><h2>⚙ 操作</h2>
    <button class="btn g" onclick="doOp('verify')">✓ 验证</button>
    <button class="btn" onclick="doOp('render')">🎨 渲染 diff</button>
    <button class="btn" onclick="doOp('pop')">⏪ pop_layer</button>
    <button class="btn g" onclick="doCheckpoint()">💾 GoodPoint</button>
    <button class="btn r" onclick="doRevert()">⏮ 回退</button>
    <button class="btn" onclick="doOp('accept')">✓ 接受</button>
    <button class="btn r" onclick="doOp('override')">✗ Override</button>
    <hr style="border-color:var(--line)">
    <label>段名: <input id="segName" value="车体"></label>
    <label>参数: <input id="paramName" value="Scale_X"></label>
    <label>值: <input id="paramVal" value="0.18"></label>
    <button class="btn" onclick="doSetParam()">Set Param</button>
  </div>
  <div class="card"><h2>📊 Segments</h2><div id="segList">加载中…</div></div>
  <div class="card"><h2>🖼 渲染</h2><img id="renderImg" src="/tiger-front34.png" alt="渲染图"></div>
  <div class="card"><h2>📝 操作日志</h2><div class="log" id="logBox"></div></div>
</div>
<script>
let selectedSeg = null;
async function refresh(){
  try{
    const r = await fetch('/api/state');
    const d = await r.json();
    document.getElementById('modeBadge').textContent = d.mode || '—';
    const segs = d.segments || {};
    document.getElementById('segCount').textContent = Object.keys(segs).length + ' 段';
    const el = document.getElementById('segList');
    el.innerHTML = Object.entries(segs).map(([k,v]) =>
      `<div class="seg ${v.dirty?'fail':'pass'} ${selectedSeg===k?'sel':''}" onclick="selectSeg('${k}')">` +
      `${k} <span style="color:var(--mut)">rev=${v.revision} ${v.dirty?'⚠ dirty':''}</span></div>`
    ).join('') || '(空)';
  }catch(e){ console.error(e) }
}
function selectSeg(name){ selectedSeg = name; document.getElementById('segName').value = name; refresh(); }
async function doOp(op){
  const r = await fetch('/api/'+op, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  const d = await r.json();
  addLog(op, d.ok !== false, d.summary || d.error?.reason || '');
  refresh();
}
async function doCheckpoint(){
  const name = prompt('GoodPoint 名称:', 'GP-' + Date.now() % 1000);
  if (!name) return;
  const r = await fetch('/api/checkpoint', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name})});
  const d = await r.json();
  addLog('checkpoint', d.ok !== false, name);
  refresh();
}
async function doRevert(){
  const name = prompt('回退到 GoodPoint:', selectedSeg || '');
  if (!name) return;
  const r = await fetch('/api/revert', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name})});
  const d = await r.json();
  addLog('revert', d.ok !== false, name);
  refresh();
}
async function doSetParam(){
  const seg = document.getElementById('segName').value;
  const param = document.getElementById('paramName').value;
  const value = parseFloat(document.getElementById('paramVal').value);
  const r = await fetch('/api/set_param', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({seg, param, value})});
  const d = await r.json();
  addLog('set_param', d.ok !== false, `${seg}.${param}=${value}`);
  refresh();
}
function addLog(action, ok, detail){
  const box = document.getElementById('logBox');
  const div = document.createElement('div');
  div.innerHTML = `<span style="color:${ok?'var(--green)':'var(--red)'}">${ok?'✅':'⛔'}</span> ${action} ${detail||''}`;
  box.prepend(div);
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
