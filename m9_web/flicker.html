<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>M9-5 · 闪烁 diff 查看器（flicker/wipe/side-by-side）</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #16181d; color: #d8dce3; font: 14px/1.5 "Segoe UI", sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid #2a2e36; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .hint { color: #8a919d; font-size: 12px; }
  main { display: flex; flex-direction: column; align-items: center; padding: 14px; gap: 12px; }
  #stage { position: relative; width: min(92vw, 720px); aspect-ratio: 1/1; background: #0d0e11;
           border: 1px solid #2a2e36; border-radius: 6px; overflow: hidden; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #imgB { visibility: hidden; }
  #wipe { position: absolute; top: 0; bottom: 0; width: 2px; background: #e05555; left: 50%;
          display: none; cursor: ew-resize; }
  #wipe::after { content: "◀ A｜B ▶"; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
                 background: #e05555; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  #clipB { position: absolute; inset: 0; clip-path: inset(0 0 0 50%); }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .controls label { font-size: 12px; color: #8a919d; }
  button { background: #2a2e36; color: #d8dce3; border: 1px solid #3a3f49; border-radius: 5px;
           padding: 5px 12px; cursor: pointer; font-size: 12px; }
  button.on { background: #e05555; border-color: #e05555; color: #fff; }
  #status { font-size: 12px; color: #8a919d; min-height: 18px; }
  #drop { border: 2px dashed #3a3f49; border-radius: 8px; padding: 18px 26px; text-align: center;
          color: #8a919d; font-size: 12px; }
  #drop.over { border-color: #e05555; color: #d8dce3; }
  .legend { display: flex; gap: 10px; font-size: 12px; }
  .tagA, .tagB { padding: 1px 8px; border-radius: 3px; }
  .tagA { background: #2a4a8a; } .tagB { background: #8a2a2a; }
</style>
</head>
<body>
<header>
  <h1>M9-5 · 闪烁 diff 查看器</h1>
  <div class="hint">Hild 2018：闪烁式对齐对比命中率 95% &gt; 并排。拖两张渲染 PNG 进来（先 A 后 B），
  或调 flickerLoad(aB64, bB64)。空格 = 暂停闪烁。</div>
</header>
<main>
  <div id="stage">
    <img id="imgA" alt="A">
    <img id="imgB" alt="B">
    <div id="clipB"><img id="imgB2" alt=""></div>
    <div id="wipe"></div>
  </div>
  <div class="legend"><span class="tagA" id="labA">A</span><span class="tagB" id="labB">B</span></div>
  <div class="controls">
    <button id="bFlicker" class="on">闪烁</button>
    <button id="bWipe">滑块擦拭</button>
    <button id="bSide">并排</button>
    <label>间隔 <input id="interval" type="range" min="120" max="1200" value="400" step="20"> <span id="ms">400ms</span></label>
  </div>
  <div id="status">拖入两张 PNG（A=改动前，B=改动后）</div>
  <div id="drop">拖放区：第 1 张 → A，第 2 张 → B</div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const imgA = $("imgA"), imgB = $("imgB"), imgB2 = $("imgB2"), wipe = $("wipe"), clipB = $("clipB");
let mode = "flicker", showB = false, timer = null, interval = 400, loaded = false;

function setMode(m) {
  mode = m;
  for (const [id, name] of [["bFlicker","flicker"],["bWipe","wipe"],["bSide","side"]])
    $(id).classList.toggle("on", mode === name);
  wipe.style.display = mode === "wipe" ? "block" : "none";
  clipB.style.clipPath = mode === "wipe" ? "inset(0 0 0 50%)" : "none";
  imgB.style.visibility = (mode === "flicker" && showB && loaded) ? "visible" :
                          (mode === "side" || mode === "wipe") ? "visible" : "hidden";
  if (mode === "side") {
    $("stage").style.width = "min(96vw, 1100px)";
    imgA.style.width = imgB.style.width = imgB2.style.width = "49%";
    imgA.style.left = "0"; imgB.style.left = "51%"; imgB2.style.left = "51%";
  } else {
    $("stage").style.width = "min(92vw, 720px)";
    for (const im of [imgA, imgB, imgB2]) { im.style.width = "100%"; im.style.left = "0"; }
  }
  if (mode === "flicker" && loaded && !timer) startTimer();
}
function startTimer() {
  stopTimer();
  timer = setInterval(() => {
    if (mode !== "flicker" || !loaded) return;
    showB = !showB;
    imgA.style.visibility = showB ? "hidden" : "visible";
    imgB.style.visibility = showB ? "visible" : "hidden";
    $("status").textContent = showB ? "◀ B" : "A ▶";
  }, interval);
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

$("bFlicker").onclick = () => setMode("flicker");
$("bWipe").onclick = () => setMode("wipe");
$("bSide").onclick = () => setMode("side");
$("interval").oninput = e => { interval = +e.target.value; $("ms").textContent = interval + "ms"; stopTimer(); startTimer(); };
document.addEventListener("keydown", e => {
  if (e.code === "Space" && mode === "flicker" && loaded) {
    e.preventDefault(); stopTimer();
    showB = !showB;
    imgA.style.visibility = showB ? "hidden" : "visible";
    imgB.style.visibility = showB ? "visible" : "hidden";
  }
});
// 滑块拖动
let dragging = false;
wipe.addEventListener("mousedown", () => dragging = true);
window.addEventListener("mouseup", () => dragging = false);
window.addEventListener("mousemove", e => {
  if (!dragging || mode !== "wipe") return;
  const r = $("stage").getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
  wipe.style.left = x + "px";
  clipB.style.clipPath = `inset(0 0 0 ${x}px)`;
});

// 拖放加载
let dropCount = 0; const b64s = [];
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  for (const f of e.dataTransfer.files)
    if (f.type === "image/png" && b64s.length < 2)
      f.arrayBuffer().then(buf => {
        const bytes = new Uint8Array(buf);
        let s = ""; for (const b of bytes) s += String.fromCharCode(b);
        b64s.push(btoa(s));
        if (b64s.length === 2) flickerLoad(b64s[0], b64s[1]);
        $("status").textContent = `已加载 ${b64s.length}/2 张`;
      });
});

// ── 对外 API（M8 工具链/AB 卡调用）─────────────────────────
window.flickerLoad = function (aB64, bB64, labelA = "A", labelB = "B") {
  const clean = s => s.replace(/^data:image\/png;base64,/, "");
  imgA.src = "data:image/png;base64," + clean(aB64);
  imgB.src = "data:image/png;base64," + clean(bB64);
  imgB2.src = imgB.src;
  loaded = true; showB = false; b64s.length = 0;
  imgA.style.visibility = "visible"; imgB.style.visibility = "hidden";
  $("labA").textContent = labelA; $("labB").textContent = labelB;
  $("status").textContent = `已加载：${labelA} vs ${labelB}`;
  if (mode === "flicker") startTimer();
};
setMode("flicker");
</script>
</body>
</html>
